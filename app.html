<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18223a">
<title>DriveMate - a driver for your car</title>
<meta name="description" content="Book a trained driver who takes you and your car home safely.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dusk: #18223a;
  --asphalt: #222f50;
  --line: #3a4a75;
  --headlight: #ffc24b;
  --mist: #e8ecf4;
  --fog: #a3aec8;
  --go: #4fd1a5;
  --danger: #ff8a8a;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--dusk);
  color: var(--mist);
  font-family: 'Hind', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

h1, h2, h3 {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin: 0;
}

h1 { font-size: 2.6rem; font-weight: 700; }
h2 { font-size: 1.6rem; font-weight: 650; }
p { margin: 0; }

a { color: var(--headlight); }

:focus-visible { outline: 3px solid var(--headlight); outline-offset: 2px; }

.shell { max-width: 520px; margin: 0 auto; padding: 20px 20px 56px; }

.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.brand { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--mist); text-decoration: none; }

.stack > * + * { margin-top: 16px; }
.stack-lg > * + * { margin-top: 28px; }

.muted { color: var(--fog); }
.error { color: var(--danger); font-size: 0.95rem; }
.hint { color: var(--fog); font-size: 0.95rem; }

/* Buttons and inputs */
.btn {
  display: block; width: 100%;
  background: var(--headlight); color: #1b1503;
  border: 0; border-radius: 14px;
  padding: 16px 20px;
  font: inherit; font-weight: 600; font-size: 1.05rem;
  text-align: center; text-decoration: none; cursor: pointer;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-quiet {
  display: block; width: 100%;
  background: transparent; color: var(--mist);
  border: 1.5px solid var(--line); border-radius: 14px;
  padding: 14px 20px;
  font: inherit; font-weight: 500; cursor: pointer;
}
.btn-quiet:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-small {
  background: var(--asphalt); color: var(--mist);
  border: 1.5px solid var(--line); border-radius: 12px;
  padding: 0 16px; font: inherit; font-weight: 500; cursor: pointer;
}
.btn-small:disabled { opacity: 0.45; cursor: not-allowed; }

.link {
  background: none; border: 0; padding: 0;
  color: var(--headlight); font: inherit; font-size: 0.95rem;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.link:disabled { color: var(--fog); cursor: not-allowed; text-decoration: none; }

.input {
  width: 100%;
  background: var(--asphalt); color: var(--mist);
  border: 1.5px solid var(--line); border-radius: 12px;
  padding: 14px 14px; font: inherit;
}
.input::placeholder { color: var(--fog); }

.label { display: block; font-size: 0.95rem; color: var(--fog); margin-bottom: 6px; }

.phone-row { display: flex; gap: 10px; }
.phone-prefix {
  display: flex; align-items: center;
  background: var(--asphalt); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 0 14px; color: var(--fog);
}
.otp-input { letter-spacing: 0.5em; text-align: center; font-size: 1.4rem; }

/* Route: the pickup-to-drop line */
.route { position: relative; padding-left: 30px; }
.route::before {
  content: ''; position: absolute; left: 8px; top: 26px; bottom: 26px; width: 2px;
  background: linear-gradient(var(--headlight), var(--line));
}
.stop { position: relative; }
.stop + .stop { margin-top: 22px; }
.stop::before {
  content: ''; position: absolute; left: -29px; top: 26px;
  width: 16px; height: 16px; border-radius: 50%;
}
.stop-pickup::before { background: var(--headlight); box-shadow: 0 0 0 5px rgba(255, 194, 75, 0.22); }
.stop-drop::before { border: 3px solid var(--headlight); background: var(--dusk); }

.field-row { display: flex; gap: 10px; }
.field-row .input { flex: 1; min-width: 0; }
.field-row .btn-small { min-height: 50px; }
.field-actions { margin-top: 8px; }

.chosen { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.chosen p { overflow-wrap: anywhere; }

.results { list-style: none; margin: 10px 0 0; padding: 0; background: var(--asphalt); border-radius: 14px; overflow: hidden; }
.results:empty { display: none; }
.results button {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; color: var(--mist);
  padding: 13px 14px; font: inherit; font-size: 0.95rem; cursor: pointer;
}
.results li + li button { border-top: 1px solid var(--line); }
.results button:hover { background: rgba(255, 255, 255, 0.05); }

/* Fare */
.fare {
  background: var(--asphalt); border-radius: 20px; padding: 20px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
}
.fare-amount { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 2.4rem; font-weight: 700; line-height: 1; }

.choice { display: flex; gap: 10px; }
.choice > * { flex: 1; }
.choice-option {
  border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; text-align: center;
}
.choice-option.on { border-color: var(--headlight); background: rgba(255, 194, 75, 0.1); }
.choice-option.off { opacity: 0.5; }
.choice-option small { display: block; color: var(--fog); }

.banner { background: var(--asphalt); border-left: 4px solid var(--headlight); border-radius: 12px; padding: 14px 16px; }

/* Trip status */
.status-title { font-size: 2rem; }
.progress { list-style: none; margin: 0; padding: 0; }
.progress li { display: flex; align-items: center; gap: 12px; padding: 7px 0; color: var(--fog); }
.progress li::before { content: ''; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.progress li.done { color: var(--mist); }
.progress li.done::before { background: var(--go); border-color: var(--go); }
.progress li.now { color: var(--headlight); font-weight: 600; }
.progress li.now::before { background: var(--headlight); border-color: var(--headlight); }

.detail { border-top: 1px solid var(--line); padding-top: 14px; }
.detail dt { color: var(--fog); font-size: 0.9rem; }
.detail dd { margin: 2px 0 14px; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
.error:empty, .hint:empty { display: none; }

/* Stage 2 additions */
.btn-quiet.as-link { text-align: center; text-decoration: none; }
.card { background: var(--asphalt); border-radius: 20px; padding: 18px; }
.card + .card { margin-top: 14px; }
.card h3 { font-size: 1.25rem; }
h3 { font-size: 1.25rem; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; min-height: 46px; }
.fare-amount-sm { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 1.8rem; font-weight: 700; line-height: 1; }
.badge { display: inline-block; font-size: 0.8rem; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--fog); }
.badge.ok { color: var(--go); border-color: var(--go); }
.badge.warn { color: var(--headlight); border-color: var(--headlight); }
.badge.bad { color: var(--danger); border-color: var(--danger); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--asphalt); border-radius: 16px; padding: 14px; }
.stat b { display: block; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 1.6rem; line-height: 1.1; }

/* DriveMate launch-ready visual refresh */
:root {
  color-scheme: dark;
  --dusk: #07111f;
  --asphalt: #101d30;
  --line: rgba(163, 181, 211, .20);
  --headlight: #c8ff5f;
  --mist: #f4f7fc;
  --fog: #a7b5cb;
  --go: #69e5b5;
  --danger: #ff9aab;
  --surface: rgba(17, 31, 51, .82);
}
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(ellipse at 12% 0%, rgba(87, 119, 190, .22), transparent 36rem),
    radial-gradient(ellipse at 95% 22%, rgba(200, 255, 95, .07), transparent 30rem),
    var(--dusk);
  color: var(--mist);
  font-size: 16px;
  line-height: 1.6;
}
.shell { width: min(100% - 36px, 960px); max-width: 960px; padding: 24px 0 72px; }
.topbar {
  position: relative;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(12, 24, 41, .76);
  backdrop-filter: blur(18px);
  box-shadow: 0 16px 44px rgba(0,0,0,.18);
  margin-bottom: 34px;
}
.brand { display: inline-flex; align-items: center; gap: 11px; font-size: 1.12rem; letter-spacing: -.03em; }
.brand::before {
  content: "D";
  display: grid; place-items: center; width: 36px; height: 36px;
  border-radius: 12px; background: var(--headlight); color: #101a0a;
  font-size: 1.15rem; font-weight: 800; box-shadow: 0 5px 22px rgba(200,255,95,.18);
}
h1 { font-size: clamp(2.45rem, 6vw, 4.4rem); max-width: 13ch; letter-spacing: -.055em; line-height: .99; }
h2 { font-size: clamp(1.55rem, 3vw, 2rem); letter-spacing: -.04em; }
h3 { font-size: 1.18rem; letter-spacing: -.025em; }
p { line-height: 1.65; }
a { transition: color .18s ease, opacity .18s ease; }
a:hover { opacity: .9; }
.btn, a.btn {
  border-radius: 15px; padding: 15px 20px; font-weight: 700;
  background: linear-gradient(135deg, #d9ff83, var(--headlight));
  box-shadow: 0 10px 28px rgba(200,255,95,.13);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn:hover, a.btn:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(200,255,95,.18); filter: brightness(1.02); }
.btn-quiet, .btn-small {
  border-color: var(--line); border-radius: 15px; background: rgba(255,255,255,.035);
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.btn-quiet:hover, .btn-small:hover { background: rgba(255,255,255,.07); border-color: rgba(200,255,95,.35); }
.input {
  min-height: 52px; border-radius: 14px; background: rgba(5, 15, 28, .72);
  border-color: var(--line); transition: border-color .18s ease, box-shadow .18s ease;
}
.input:focus { outline: none; border-color: rgba(200,255,95,.7); box-shadow: 0 0 0 4px rgba(200,255,95,.09); }
.phone-prefix { border-color: var(--line); border-radius: 14px; background: rgba(255,255,255,.04); }
.card, .fare, .route, .stat, .chosen, .banner, .help-panel {
  border: 1px solid var(--line); border-radius: 20px;
  background: linear-gradient(145deg, rgba(22, 39, 63, .86), rgba(11, 24, 41, .9));
  box-shadow: 0 18px 48px rgba(0,0,0,.12);
}
.card { padding: clamp(17px, 3vw, 24px); }
.card + .card { margin-top: 14px; }
.fare, .route { padding: clamp(18px, 3vw, 26px); }
.stat { background: rgba(255,255,255,.035); padding: 20px; }
.stat b { display: block; font-size: clamp(1.5rem, 4vw, 2.1rem); }
.badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); color: var(--mist); }
.badge.ok { color: var(--go); border-color: rgba(105,229,181,.25); background: rgba(105,229,181,.08); }
.badge.warn { color: var(--headlight); border-color: rgba(200,255,95,.22); }
.badge.bad { color: var(--danger); border-color: rgba(255,154,171,.25); }
.results { border: 1px solid var(--line); border-radius: 16px; background: #0c192a; }
.detail dt { color: var(--fog); }
.error { padding: 10px 12px; border-radius: 12px; background: rgba(255, 91, 121, .08); }
.hint, .muted { color: var(--fog); }
.help-panel { padding: 15px 17px; box-shadow: none; }
.help-panel summary { cursor: pointer; color: var(--headlight); font-weight: 600; }
.help-panel p, .help-panel li { color: var(--fog); font-size: .94rem; }
.help-panel ul { padding-left: 20px; margin: 12px 0 0; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 22px; align-items: stretch; }
.hero-copy { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: clamp(12px, 2vw, 24px) 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--headlight); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: currentColor; }
.hero-panel { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: clamp(20px, 4vw, 32px); border: 1px solid var(--line); border-radius: 26px; background: radial-gradient(circle at 85% 0%, rgba(200,255,95,.12), transparent 15rem), linear-gradient(145deg, rgba(21,39,62,.96), rgba(10,22,38,.98)); box-shadow: 0 24px 70px rgba(0,0,0,.18); }
.hero-stat { display: flex; gap: 13px; align-items: flex-start; }
.hero-icon { display: grid; place-items: center; flex: 0 0 40px; height: 40px; border-radius: 13px; color: var(--headlight); background: rgba(200,255,95,.09); border: 1px solid rgba(200,255,95,.18); font-size: 1.1rem; }
.feature-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.feature-card { border: 1px solid var(--line); border-radius: 18px; padding: 20px; background: rgba(255,255,255,.025); }
.feature-card p { color: var(--fog); font-size: .94rem; margin-top: 8px; }
.section-block { margin-top: 42px; }
.section-heading { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 16px; }
.section-heading p { max-width: 38ch; }
